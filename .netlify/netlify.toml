[build.environment]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]
node_bundler = "esbuild"

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; upgrade-insecure-requests"
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-store, max-age=0"
X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
for = "/emergencia.html"

[headers.values]
Cache-Control = "no-store, max-age=0"
X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
for = "/assets/js/data/*"

[headers.values]
Cache-Control = "no-store, max-age=0"

[[headers]]
for = "/assets/docs/*"

[headers.values]
Cache-Control = "no-store, max-age=0"
Content-Disposition = "inline"

[[headers]]
for = "/assets/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/img/*"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/assets/css/*"

[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/assets/js/*"

[headers.values]
Cache-Control = "public, max-age=3600"

[[redirects]]
from = "/emergencia"
to = "/emergencia.html"
status = 200.0
force = false

